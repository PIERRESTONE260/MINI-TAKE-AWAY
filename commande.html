<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MINI TAKE-AWAY | Passer la commande</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>
    <body>

        <header class="navbar">
            <a href="index.html" class="logo">
                MINI <span>TAKE-AWAY</span>
            </a>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="menu.html">Notre menu</a>
                <a href="index.html#contact">Contact</a>
            </nav>
            <a href="panier.html" class="btn-primary" style="background: var(--dark);">
                Panier
            </a>
        </header>

        <main style="padding: 50px 7%; min-height: 60vh;">
            <div style="margin-bottom: 40px; text-align: center;">
                <span class="tagline">FINALISATION</span>
                <h1 style="font-size: 38px; margin-top: 10px;">Passer votre commande</h1>
            </div>

            <div style="max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                <form>
                    <div style="margin-bottom: 25px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 8px;">Mode de réception</label>
                        <select style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white;">
                            <option>Retrait sur place</option>
                            <option>Livraison à domicile</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 25px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 8px;">Nom complet</label>
                        <input type="text" placeholder="Ex: Pierre Ngoy" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>

                    <div style="margin-bottom: 25px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 8px;">Numéro de téléphone</label>
                        <input type="tel" placeholder="Ex: +243..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    </div>

                    <div style="margin-bottom: 30px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 8px;">Adresse (si livraison) ou instructions</label>
                        <textarea rows="3" placeholder="Précisez votre adresse ou vos instructions..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;"></textarea>
                    </div>

                    <button type="submit" class="btn-primary" style="display: block; text-align: center; width: 100%; border: none; cursor: pointer; font-size: 16px;">Confirmer la commande</button>
                </form>
            </div>
        </main>

        <footer>
            <p>© 2026 MINI TAKE-AWAY</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase.js"></script>
        <script src="js/commande.js"></script>
    </body>
</html>
