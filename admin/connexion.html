<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MINI TAKE-AWAY | Administration - Connexion</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/responsive.css">
    </head>
    <body style="background: var(--dark); display: flex; align-items: center; justify-content: center; min-height: 100vh;">

        <div style="background: white; width: 100%; max-width: 420px; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            
            <div style="text-align: center; margin-bottom: 30px;">
                <a href="../index.html" class="logo" style="font-size: 24px;">
                    MINI <span>TAKE-AWAY</span>
                </a>
                <p style="color: var(--primary); font-weight: bold; font-size: 14px; margin-top: 5px;">ESPACE ADMINISTRATION</p>
            </div>

            <form>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Adresse e-mail</label>
                    <input type="email" placeholder="admin@minitakeaway.com" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">Mot de passe</label>
                    <input type="password" placeholder="••••••••" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>

                <a href="dashboard.html" class="btn-primary" style="display: block; text-align: center; width: 100%;">Se connecter</a>
            </form>

            <div style="text-align: center; margin-top: 25px;">
                <a href="../index.html" style="color: var(--text); text-decoration: none; font-size: 13px;">← Retour au site client</a>
            </div>

        </div>

    </body>
</html>
